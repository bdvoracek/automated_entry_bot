<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>51Folds — Meta Mode</title>
<style>
  :root{
    --bg:#1b1b1b; --card:#2a2a2a; --card2:#303030; --track:#3d3d3d;
    --ink:#f3f1ed; --muted:#9a9a9a; --line:#3a3a3a;
    --coral:#e0846a; --blue:#6f9bff; --white:#ffffff;
    --r:18px; --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 120px}

  /* header */
  h1{font-size:clamp(24px,3.6vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .sub b{color:var(--ink);font-weight:600}

  .toolbar{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin:0 0 26px}
  .tool{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);
    font:inherit;font-size:13px;cursor:pointer;padding:4px;transition:.15s}
  .tool:hover{color:var(--ink)} .tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}

  .toggle{display:flex;justify-content:center;margin:0 0 30px}
  .seg-wrap{display:inline-flex;background:#242424;border-radius:999px;padding:5px;gap:4px}
  .seg{border:none;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;
    padding:11px 46px;border-radius:999px;cursor:pointer;transition:.18s}
  .seg.active{background:var(--white);color:#1a1a1a}

  .view{display:block} .view.hidden{display:none}

  /* outcome: split panes with draggable divider + minimise */
  .split{display:flex;align-items:stretch;gap:0}
  .split.dragging{user-select:none} .split.dragging .pane{transition:none}
  .card{background:var(--card);border-radius:var(--r);padding:26px 30px;box-shadow:var(--shadow)}
  .pane{flex:1 1 0;min-width:0;padding:22px 24px;display:flex;flex-direction:column;overflow:hidden;transition:flex-grow .25s ease,flex-basis .25s ease}
  .pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 20px;letter-spacing:.03em}
  .pane-h .min{background:none;border:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;flex:none}
  .pane-h .min:hover{color:var(--coral)}
  .divider{flex:0 0 16px;display:flex;align-items:center;justify-content:center;cursor:col-resize;align-self:stretch;touch-action:none}
  .divider span{width:4px;height:48px;border-radius:3px;background:#3d3d3d;transition:background .15s,height .15s}
  .divider:hover span{background:var(--coral);height:70px}
  .pane.min{flex:0 0 46px!important;padding:18px 6px;cursor:pointer}
  .pane.min .bars,.pane.min .cdf{display:none}
  .pane.min .pane-h{writing-mode:vertical-rl;transform:rotate(180deg);margin:0;color:var(--ink)}
  @media(max-width:760px){
    .split{flex-direction:column}
    .divider{display:none}
    .pane,.pane.min{flex:auto!important;padding:22px 24px!important;cursor:auto!important}
    .pane.min .bars,.pane.min .cdf{display:block}
    .pane.min .pane-h{writing-mode:horizontal-tb;transform:none}
  }
  .bars{display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center}
  .bar-row{display:grid;grid-template-columns:62px 1fr 94px;align-items:center;gap:12px}
  .bar-lab{font-size:13.5px;color:var(--ink)}
  /* CDF chart */
  .cdf{width:100%;height:auto;display:block}
  .cdf .grid{stroke:#2f2f2f;stroke-width:1}
  .cdf .axis{stroke:#3a3a3a;stroke-width:1}
  .cdf .tick{fill:#7f7f7f;font-size:10px;font-variant-numeric:tabular-nums}
  .cdf .curve{fill:none;stroke:var(--coral);stroke-width:2.6;stroke-linejoin:round}
  .cdf .area{fill:var(--coral);opacity:.13}
  .cdf .dens-base{fill:none;stroke:#8f97a8;stroke-width:2;opacity:.95}   /* the 'before' curve */
  .cdf .bound{stroke:#4c4c4c;stroke-width:1;stroke-dasharray:2 3;opacity:.8}
  .cdf .med{stroke:var(--coral);stroke-width:1.6}
  .cdf .med.base{stroke:#8f97a8;stroke-width:1.4;stroke-dasharray:4 3;opacity:.95}
  .cdf .medlab{fill:var(--coral);font-size:10.5px;font-weight:700}
  .cdf .medlab.base{fill:#9aa2b2;font-weight:600}
  .cdf .taillab{fill:#9a9a9a;font-size:9.5px;font-weight:700}
  .cdf .lgd{fill:var(--muted);font-size:10px;font-weight:600}
  .cdf .pct{stroke:#c9c9c9;stroke-width:1;stroke-dasharray:3 3;opacity:.45}
  .cdf .pctlab{fill:#b6b6b6;font-size:9px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar-track{position:relative;height:12px;background:#232323;border-radius:999px;overflow:visible}
  .bar-fill{position:absolute;top:0;left:0;height:100%;width:0;background:var(--coral);border-radius:999px;
    transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .bar-ghost{position:absolute;top:-4px;height:20px;width:2px;background:var(--muted);opacity:.55;
    transition:left .7s cubic-bezier(.2,.7,.2,1)}
  .bar-val{text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
    display:flex;gap:9px;justify-content:flex-end;align-items:baseline}
  .pp{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .pp.up{color:var(--coral)} .pp.down{color:var(--blue)} .pp.flat{color:var(--muted)}

  .takeaway{margin-top:38px}
  .takeaway h2{font-size:26px;font-weight:600;margin:0 0 14px}
  .takeaway p{color:#d7d5d0;font-size:16px;line-height:1.65;margin:0;max-width:70ch}
  .takeaway .amber{color:var(--coral);font-weight:600} .takeaway .cool{color:var(--blue);font-weight:600}

  /* drivers */
  .dhead{display:flex;justify-content:flex-end;margin-bottom:6px}
  .sortwrap{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    background:#242424;border-radius:14px;padding:9px 18px;min-width:280px}
  .sortwrap label{font-size:12px;color:var(--muted)}
  .sortwrap select{background:transparent;border:none;color:var(--ink);font:inherit;font-size:15px;font-weight:500;
    cursor:pointer;outline:none;width:100%}
  .sortwrap select option{background:#242424}

  .drow{border-top:1px solid var(--line);padding:22px 4px}
  .drow:first-child{border-top:none}
  .drow-top{display:grid;grid-template-columns:1fr auto 24px;align-items:center;gap:24px}
  .dname{font-size:18px;font-weight:500;letter-spacing:-.01em}
  .dname .changed{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--coral);
    margin-left:9px;vertical-align:2px;opacity:0;transition:.15s}
  .drow.on .dname .changed{opacity:1}
  .dsub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .dsub .wt{color:#7f7f7f}
  /* 5-stop RELATIVE selector (-2..+2); center 0 = neutral */
  .sel{display:flex;background:var(--track);border-radius:999px;padding:5px;gap:3px}
  .stop{border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;min-width:52px;
    padding:9px 0;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
  .stop:hover{color:var(--ink)}
  .stop.active{background:var(--white);color:#1a1a1a}
  .stop.zero.active{background:#4d4d4d;color:var(--ink)}   /* neutral looks distinct from a real shift */
  .chev{background:none;border:none;color:var(--blue);font-size:22px;cursor:pointer;line-height:1;padding:2px;
    transition:transform .18s;justify-self:end}
  .chev.open{transform:rotate(90deg)}
  .members{margin-top:16px;display:none}
  .members.open{display:block}
  .members table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .members td{padding:5px 10px;border-bottom:1px solid #333;color:var(--muted)}
  .members td.m{color:var(--blue);font-weight:600;width:48px}
  .members td.c{color:var(--ink);width:70px}
  .members td.res{text-align:right}
  .members td .arrow{color:var(--coral)}

  /* action bar */
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(27,27,27,0),var(--bg) 34%);
    padding:20px 24px 22px}
  .actioninner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px}
  button.act{font:inherit;border:none;border-radius:999px;padding:13px 26px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .btn-apply{background:var(--coral);color:#2a0f07} .btn-apply:hover{filter:brightness(1.06)}
  .btn-apply:disabled{opacity:.35;cursor:default}
  .btn-reset{background:#333;color:var(--ink)} .btn-reset:hover{background:#3d3d3d}
  .btn-reset:disabled{opacity:.4;cursor:default}
  .pending{font-size:13px;color:var(--muted)} .pending b{color:var(--coral)}
  .status{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .status.live{color:var(--coral)}
  .spinner{width:13px;height:13px;border:2px solid #ffffff44;border-top-color:#2a0f07;border-radius:50%;
    display:inline-block;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* waiting UX (screen 3): big card, rotating coral dot-ring + message */
  .hidden{display:none!important}
  .loading{min-height:352px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .dotspin{position:relative;width:48px;height:48px;margin-bottom:28px;animation:dotrot .8s linear infinite}
  .dotspin i{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--coral)}
  .dotspin i:nth-child(1){transform:rotate(0deg)   translateY(-17px);opacity:1}
  .dotspin i:nth-child(2){transform:rotate(45deg)  translateY(-17px);opacity:.9}
  .dotspin i:nth-child(3){transform:rotate(90deg)  translateY(-17px);opacity:.8}
  .dotspin i:nth-child(4){transform:rotate(135deg) translateY(-17px);opacity:.64}
  .dotspin i:nth-child(5){transform:rotate(180deg) translateY(-17px);opacity:.5}
  .dotspin i:nth-child(6){transform:rotate(225deg) translateY(-17px);opacity:.38}
  .dotspin i:nth-child(7){transform:rotate(270deg) translateY(-17px);opacity:.28}
  .dotspin i:nth-child(8){transform:rotate(315deg) translateY(-17px);opacity:.2}
  @keyframes dotrot{to{transform:rotate(360deg)}}
  .loadmsg{font-size:17px;color:var(--ink);line-height:1.7;margin:0}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(16px);opacity:0;
    background:#2a1512;color:var(--coral);border:1px solid #5a2a20;padding:10px 16px;border-radius:10px;
    font-size:13px;font-weight:600;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="q">…</h1>
  <p class="sub" id="sub">…</p>

  <div class="toolbar">
    <button class="tool" data-act="revert"><svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-3"/></svg>Revert</button>
    <button class="tool" data-act="noop"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8 11l8-5M8 13l8 5"/></svg>Share</button>
    <button class="tool" data-act="noop"><svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>Reporting</button>
    <button class="tool" data-act="noop"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy</button>
    <button class="tool" data-act="noop"><svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>View chat</button>
    <button class="tool" data-act="noop"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/></svg></button>
  </div>

  <div class="toggle">
    <div class="seg-wrap">
      <button class="seg active" id="tab-outcome">Outcome</button>
      <button class="seg" id="tab-drivers">Drivers</button>
    </div>
  </div>

  <!-- OUTCOME -->
  <section class="view" id="view-outcome">
    <div class="card loading hidden" id="loading">
      <div class="dotspin"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="loadmsg">Your model is updating.<br>This will take a few moments.</p>
    </div>
    <div id="outcome-content">
      <div class="split" id="split">
        <div class="card pane" id="pane-cat">
          <div class="pane-h"><span>Unified categorical probabilities</span><button class="min" data-pane="cat" title="minimise">«</button></div>
          <div class="bars" id="bars"></div>
        </div>
        <div class="divider" id="divider" title="drag to resize · double-click to reset"><span></span></div>
        <div class="card pane" id="pane-dens">
          <div class="pane-h"><span>Unified density · price on 28 Aug 2026</span><button class="min" data-pane="dens" title="minimise">»</button></div>
          <svg class="cdf" id="cdf" viewBox="0 0 460 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Probability density with tails"></svg>
        </div>
      </div>
      <div class="takeaway"><h2>Take away</h2><p id="takeaway">…</p></div>
    </div>
  </section>

  <!-- DRIVERS -->
  <section class="view hidden" id="view-drivers">
    <div class="dhead">
      <div class="sortwrap">
        <label>Sort Order</label>
        <select id="sort">
          <option value="desc">Driver Influence (Most to Least)</option>
          <option value="asc">Driver Influence (Least to Most)</option>
        </select>
      </div>
    </div>
    <div id="drivers"></div>
  </section>
</div>

<div class="actionbar"><div class="actioninner">
  <span class="pending" id="pending"></span>
  <button class="act btn-reset" id="reset">Reset</button>
  <button class="act btn-apply" id="apply" disabled>Apply changes</button>
  <span class="status" id="status">baseline</span>
</div></div>
<div class="toast" id="toast"></div>

<script>
const STOPS=[-2,-1,0,1,2];
const STATES=["Negligible","Low","Medium","High","Extreme"];
let MODEL=null, deltas={}, appliedDeltas={}, busy=false, sortMode='desc';

const $=id=>document.getElementById(id);
const fmtpp=v=>(v>=0?'+':'')+(v*100).toFixed(1)+'pp';
const sidx=s=>{const i=STATES.indexOf(s);return i<0?0:i;};
const clampState=i=>STATES[Math.max(0,Math.min(4,i))];
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);};

async function boot(){
  MODEL=await (await fetch('/api/model')).json();
  $('q').textContent=MODEL.question;
  $('sub').innerHTML=`<b>${MODEL.tier}</b> · ${MODEL.n_models} models · <b>${MODEL.n_unified}</b> unified drivers · driver changes are free`;
  MODEL.drivers.forEach(d=>{deltas[d.uid]=0;appliedDeltas[d.uid]=0;});
  renderBars(MODEL.baseline,null); renderDist(MODEL.baseline,null); setTakeaway(null);
  renderDrivers(); initPanes();
  $('sort').onchange=e=>{sortMode=e.target.value;renderDrivers();};
  $('tab-outcome').onclick=()=>switchView('outcome');
  $('tab-drivers').onclick=()=>switchView('drivers');
  document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{
    if(b.dataset.act==='revert') $('reset').click(); else toast('Not wired in the meta-mode demo');
  });
}

function switchView(v){
  $('view-outcome').classList.toggle('hidden',v!=='outcome');
  $('view-drivers').classList.toggle('hidden',v!=='drivers');
  $('tab-outcome').classList.toggle('active',v==='outcome');
  $('tab-drivers').classList.toggle('active',v==='drivers');
}

// ---- resizable / minimisable split panes ----
let paneMode='split', splitPct=0.5;   // mode: 'split' | 'min-cat' | 'min-dens'
function applyPaneLayout(){
  const cat=$('pane-cat'), dens=$('pane-dens');
  cat.classList.toggle('min',paneMode==='min-cat');
  dens.classList.toggle('min',paneMode==='min-dens');
  if(paneMode==='split'){ cat.style.flex=`${splitPct} 1 0`; dens.style.flex=`${1-splitPct} 1 0`; }
  else { cat.style.flex=''; dens.style.flex=''; }
  cat.querySelector('.min').textContent = paneMode==='min-cat' ? '»' : '«';
  dens.querySelector('.min').textContent = paneMode==='min-dens' ? '«' : '»';
}
function initPanes(){
  const cat=$('pane-cat'), dens=$('pane-dens'), split=$('split'), div=$('divider');
  cat.querySelector('.min').onclick=e=>{e.stopPropagation();paneMode=paneMode==='min-cat'?'split':'min-cat';applyPaneLayout();};
  dens.querySelector('.min').onclick=e=>{e.stopPropagation();paneMode=paneMode==='min-dens'?'split':'min-dens';applyPaneLayout();};
  cat.onclick=()=>{if(paneMode==='min-cat'){paneMode='split';applyPaneLayout();}};
  dens.onclick=()=>{if(paneMode==='min-dens'){paneMode='split';applyPaneLayout();}};
  const onMove=e=>{
    const r=split.getBoundingClientRect(); let p=(e.clientX-r.left)/r.width;
    if(p<0.12)paneMode='min-cat'; else if(p>0.88)paneMode='min-dens';
    else {paneMode='split';splitPct=Math.max(0.12,Math.min(0.88,p));}
    applyPaneLayout();
  };
  const onUp=()=>{split.classList.remove('dragging');
    window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);};
  div.addEventListener('pointerdown',e=>{e.preventDefault();split.classList.add('dragging');
    window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);});
  div.addEventListener('dblclick',()=>{paneMode='split';splitPct=0.5;applyPaneLayout();});
  applyPaneLayout();
}

function scaleMax(d){return Math.max(0.35,Math.max(...Object.values(d))*1.12);}
function renderBars(dist,baseline){
  const max=scaleMax(dist);
  $('bars').innerHTML=MODEL.outcomes.map(lab=>{
    const v=dist[lab]||0,w=(v/max*100).toFixed(1);
    let chip='';
    if(baseline){const dp=v-(baseline[lab]||0),c=Math.abs(dp)<0.001?'flat':dp>0?'up':'down';chip=`<span class="pp ${c}">${fmtpp(dp)}</span>`;}
    const ghost=baseline?`<div class="bar-ghost" style="left:${((baseline[lab]||0)/max*100).toFixed(1)}%"></div>`:'';
    return `<div class="bar-row"><span class="bar-lab">${lab}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div>${ghost}</div>
      <span class="bar-val">${(v*100).toFixed(1)}%${chip}</span></div>`;
  }).join('');
}

function catmull(pts){                       // smooth path through [[x,y]...]
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  } return d;
}

// median price (where the CDF crosses 0.5), interpolated on the price axis
// Percentiles + tail mass straight from the bin masses over the effective edges
// (uniform-within-bin), consistent with the density curve and covering the open
// tails — so P90 can legitimately land past $100.
function binStats(dist){
  const e=MODEL.bin_edges, labels=MODEL.bin_labels, n=labels.length;
  const raw=labels.map(l=>dist[l]||0), tot=raw.reduce((a,b)=>a+b,0)||1, m=raw.map(x=>x/tot);
  const price=q=>{let c=0;for(let i=0;i<n;i++){const nc=c+m[i];
    if(nc>=q)return e[i]+(m[i]?(q-c)/m[i]:0)*(e[i+1]-e[i]); c=nc;} return e[n];};
  const below=x=>{let c=0;for(let i=0;i<n;i++){
    if(x>=e[i+1])c+=m[i]; else if(x>e[i]){c+=m[i]*(x-e[i])/(e[i+1]-e[i]);break;} else break;} return c;};
  return {p10:price(0.1),p50:price(0.5),p90:price(0.9),below60:below(60),above100:1-below(100)};
}

// Density over price: mass/width per bin, smoothed, tails drawn to the effective
// edges. Overlays the 'before' curve; marks P10 / median / P90 and the tail mass.
function renderDist(dist, base){
  const edges=MODEL.bin_edges, labels=MODEL.bin_labels, n=labels.length;
  const centers=[],widths=[];
  for(let i=0;i<n;i++){centers.push((edges[i]+edges[i+1])/2); widths.push(edges[i+1]-edges[i]);}
  const dens=d=>labels.map((l,i)=>(d[l]||0)/widths[i]);
  const dA=dens(dist), dB=base?dens(base):null;
  const sA=binStats(dist), sB=base?binStats(base):null;
  const ymax=(Math.max(...dA, ...(dB||[0]))*1.2)||1;
  const W=460,H=320,m={l:16,r:16,t:44,b:44}, x0=edges[0]+1, x1=edges[n]-2;
  const sx=v=> m.l+(Math.max(x0,Math.min(x1,v))-x0)/(x1-x0)*(W-m.l-m.r);
  const sy=v=> (H-m.b)-(v/ymax)*(H-m.t-m.b);
  const pts=d=>[[x0,0],...centers.map((c,i)=>[c,d[i]]),[x1,0]].map(([X,Y])=>[sx(X),sy(Y)]);
  let g='';
  [60,70,80,90,100,110].forEach(xv=>{const xx=sx(xv);
    g+=`<line class="grid" x1="${xx.toFixed(1)}" y1="${m.t}" x2="${xx.toFixed(1)}" y2="${H-m.b}"/>`+
       `<text class="tick" x="${xx.toFixed(1)}" y="${H-m.b+16}" text-anchor="middle">$${xv}</text>`;});
  [60,100].forEach(b=>{const xx=sx(b).toFixed(1); g+=`<line class="bound" x1="${xx}" y1="${m.t}" x2="${xx}" y2="${H-m.b}"/>`;});
  g+=`<text class="taillab" x="${sx(x0).toFixed(1)}" y="${m.t+13}" text-anchor="start">&lt;$60 · ${(sA.below60*100).toFixed(0)}%</text>`;
  g+=`<text class="taillab" x="${(W-m.r).toFixed(1)}" y="${m.t+13}" text-anchor="end">&gt;$100 · ${(sA.above100*100).toFixed(0)}%</text>`;
  g+=`<line class="curve" x1="${m.l}" y1="16" x2="${m.l+18}" y2="16"/><text class="lgd" x="${m.l+24}" y="19.5">adjusted</text>`;
  if(sB) g+=`<line class="dens-base" x1="${m.l+96}" y1="16" x2="${m.l+114}" y2="16"/><text class="lgd" x="${m.l+120}" y="19.5">before</text>`;
  const A=pts(dA), curveA=catmull(A);
  const baseCurve=dB?`<path class="dens-base" d="${catmull(pts(dB))}"/>`:'';
  // P10 / P90 (bottom labels) + median on top (with shift)
  const pctLine=(p,lab)=>{const xx=sx(p).toFixed(1);
    return `<line class="pct" x1="${xx}" y1="${m.t}" x2="${xx}" y2="${H-m.b}"/>`+
           `<text class="pctlab" x="${xx}" y="${H-m.b-6}" text-anchor="middle">${lab} $${p.toFixed(0)}</text>`;};
  let marks=pctLine(sA.p10,'P10')+pctLine(sA.p90,'P90');
  const medLine=(p,cls,lab,ly)=>{const xx=sx(p).toFixed(1);
    return `<line class="med ${cls}" x1="${xx}" y1="${m.t}" x2="${xx}" y2="${H-m.b}"/>`+
           `<text class="medlab ${cls}" x="${xx}" y="${ly}" text-anchor="middle">${lab}</text>`;};
  if(sB) marks+=medLine(sB.p50,'base',`$${sB.p50.toFixed(0)}`, m.t-16);
  marks+=medLine(sA.p50,'', sB?`median → $${sA.p50.toFixed(0)}`:`median $${sA.p50.toFixed(0)}`, m.t-4);
  $('cdf').innerHTML=g+`<path class="area" d="${curveA} Z"/>`+baseCurve+`<path class="curve" d="${curveA}"/>`+marks;
}

function setTakeaway(res){
  const el=$('takeaway');
  if(!res){
    const s=binStats(MODEL.baseline);
    el.innerHTML=`No shifts applied — the <b>${MODEL.n_models}-model</b> ensemble baseline. Median <b>$${s.p50.toFixed(1)}</b>, 80% interval <b>P10 $${s.p10.toFixed(0)}</b> – <b>P90 $${s.p90.toFixed(0)}</b>, with <b>${(s.above100*100).toFixed(0)}%</b> of the mass above $100. Open <b>Drivers</b>, nudge a unified driver, and Apply to fan the change out to every model.`;
    return;
  }
  const sB=binStats(res.baseline), sA=binStats(res.adjusted);
  const setLbl=Object.entries(deltas).filter(([,v])=>v!==0)
    .map(([u,v])=>`<b>${MODEL.drivers.find(d=>d.uid==u).name}</b> ${v>0?'+'+v:v}`).join(', ');
  const arrow=(a,b)=>{const c=b>=a?'amber':'cool';return `$${a.toFixed(0)} → <span class="${c}">$${b.toFixed(0)}</span>`;};
  const t=res.timings;
  el.innerHTML=`Shifting ${setLbl} moved the forecast. <b>Median</b> ${arrow(sB.p50,sA.p50)}, <b>P10</b> ${arrow(sB.p10,sA.p10)}, <b>P90</b> ${arrow(sB.p90,sA.p90)}. The <b>&gt;$100 tail</b> goes from ${(sB.above100*100).toFixed(0)}% to <span class="${sA.above100>=sB.above100?'amber':'cool'}">${(sA.above100*100).toFixed(0)}%</span>. ${t.n_done}/${t.n_touched} models recomputed in ${t.total_s}s.`;
}

function renderDrivers(){
  const ordered=[...MODEL.drivers].sort((a,b)=>sortMode==='desc'?b.weight-a.weight:a.weight-b.weight);
  $('drivers').innerHTML=ordered.map(d=>{
    const cur=deltas[d.uid]||0;
    const sel=STOPS.map(v=>`<button class="stop ${v===cur?'active':''} ${v===0?'zero':''}" data-uid="${d.uid}" data-v="${v}">${v>0?'+'+v:v}</button>`).join('');
    const rows=d.members.map(m=>{
      const res=clampState(sidx(m.baseline)+cur);
      const shown=cur!==0?`${m.baseline} <span class="arrow">→ ${res}</span>`:m.baseline;
      return `<tr><td class="m">${m.model}</td><td class="c">${m.code}</td><td>${m.name}</td><td class="res">${shown}</td></tr>`;
    }).join('');
    return `<div class="drow ${cur!==0?'on':''}" id="drow-${d.uid}">
      <div class="drow-top">
        <div><div class="dname">${d.name}<span class="changed"></span></div>
          <div class="dsub">${d.models_covered}/${MODEL.n_models} models · <span class="wt">influence weight ${d.weight}</span></div></div>
        <div class="sel">${sel}</div>
        <button class="chev" data-uid="${d.uid}">›</button>
      </div>
      <div class="members" id="mem-${d.uid}"><table>${rows}</table></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{
    if(busy)return;
    const uid=+b.dataset.uid,v=+b.dataset.v; deltas[uid]=v;
    const row=b.closest('.drow');
    row.querySelectorAll('.stop').forEach(s=>{s.classList.toggle('active',+s.dataset.v===v);});
    row.classList.toggle('on',v!==0);
    // refresh the member preview arrows
    const d=MODEL.drivers.find(x=>x.uid===uid);
    row.querySelector('.members table').innerHTML=d.members.map(m=>{
      const res=clampState(sidx(m.baseline)+v);
      const shown=v!==0?`${m.baseline} <span class="arrow">→ ${res}</span>`:m.baseline;
      return `<tr><td class="m">${m.model}</td><td class="c">${m.code}</td><td>${m.name}</td><td class="res">${shown}</td></tr>`;
    }).join('');
    refreshPending();
  });
  document.querySelectorAll('.chev').forEach(c=>c.onclick=()=>{
    c.classList.toggle('open'); $('mem-'+c.dataset.uid).classList.toggle('open');
  });
}

function showLoading(b){
  $('loading').classList.toggle('hidden',!b);
  $('outcome-content').classList.toggle('hidden',b);
}
function refreshPending(){
  if(busy) return;                          // status line owns the message while recomputing
  // "pending" = drivers whose current shift differs from what was last applied
  const unapplied=MODEL.drivers.filter(d=>(deltas[d.uid]||0)!==(appliedDeltas[d.uid]||0)).length;
  const active=Object.values(deltas).filter(v=>v!==0).length;
  $('apply').disabled=unapplied===0||busy;
  $('pending').innerHTML = unapplied
    ? `<b>${unapplied}</b> change${unapplied>1?'s':''} not yet applied`
    : (active?`<b>${active}</b> driver${active>1?'s':''} shifted · applied`:'');
}

$('apply').onclick=async()=>{
  const active=Object.fromEntries(Object.entries(deltas).filter(([,v])=>v!==0));
  if(!Object.keys(active).length)return;
  switchView('outcome'); showLoading(true);         // flick to Outcome + waiting UX immediately
  setBusy(true,`<span class="spinner"></span>recomputing ${MODEL.n_models} models…`);
  $('status').textContent='recomputing…';$('status').classList.add('live');
  try{
    const r=await (await fetch('/api/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deltas:active})})).json();
    if(r.error){toast(r.error);showLoading(false);setBusy(false);$('status').textContent='error';return;}
    renderBars(r.adjusted,r.baseline); renderDist(r.adjusted,r.baseline); setTakeaway(r);
    appliedDeltas={...deltas};                       // this setting is now the applied state
    showLoading(false);                              // reveal the fresh answers
    $('status').textContent=`adjusted · ${r.timings.n_done}/${r.timings.n_touched} in ${r.timings.total_s}s`;
    $('status').classList.add('live');
  }catch(e){showLoading(false);toast('request failed: '+e);}
  setBusy(false);
};

$('reset').onclick=async()=>{
  switchView('outcome'); showLoading(true);
  setBusy(true,`<span class="spinner"></span>resetting to baseline…`);
  try{
    const r=await (await fetch('/api/reset',{method:'POST'})).json();
    if(r.baseline)MODEL.baseline=r.baseline;
    MODEL.drivers.forEach(d=>{deltas[d.uid]=0;appliedDeltas[d.uid]=0;});
    renderDrivers(); renderBars(MODEL.baseline,null); renderDist(MODEL.baseline,null); setTakeaway(null);
    showLoading(false);
    $('status').textContent='baseline';$('status').classList.remove('live');
  }catch(e){showLoading(false);toast('reset failed: '+e);}
  setBusy(false);
};

function setBusy(b,note){
  busy=b;
  $('apply').disabled=b||!Object.values(deltas).some(v=>v!==0);
  $('reset').disabled=b;
  $('pending').innerHTML=b?note:'';
  if(!b)refreshPending();
}

boot();
</script>
</body>
</html>
