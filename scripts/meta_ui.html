<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>51Folds — Meta Mode</title>
<style>
  :root{
    --bg:#141414; --panel:#1e1e1e; --panel2:#262626; --track:#343434;
    --ink:#f2f0ec; --muted:#8c8c8c; --line:#2f2f2f;
    --coral:#e8836b; --coral-soft:#e8836b; --blue:#6e79e8; --white:#ffffff;
    --r:16px; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:36px 22px 80px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
  h1{font-size:clamp(22px,3.4vw,30px);line-height:1.15;margin:0 0 8px;letter-spacing:-.01em;font-weight:650;text-wrap:balance}
  .meta{color:var(--muted);font-size:13px;margin:0}
  .meta b{color:var(--ink);font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);margin-top:20px}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .phead h2{font-size:14px;font-weight:600;margin:0;letter-spacing:.01em}
  .status{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .status.live{color:var(--coral)}

  /* outcome bars */
  .bars{margin-top:14px;display:flex;flex-direction:column;gap:13px}
  .bar-row{display:grid;grid-template-columns:118px 1fr 118px;align-items:center;gap:14px}
  .bar-lab{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar-track{position:relative;height:22px;background:var(--track);border-radius:7px;overflow:hidden}
  .bar-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--coral);border-radius:7px;
    transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .bar-ghost{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.65;transition:left .7s cubic-bezier(.2,.7,.2,1)}
  .bar-val{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;display:flex;gap:8px;justify-content:flex-end;align-items:baseline}
  .pp{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
  .pp.up{color:var(--coral)} .pp.down{color:var(--blue)} .pp.flat{color:var(--muted)}

  /* controls */
  .controls{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  button{font:inherit;border:none;border-radius:999px;padding:10px 20px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
  .btn-apply{background:var(--coral);color:#241009}
  .btn-apply:hover{filter:brightness(1.06)} .btn-apply:disabled{opacity:.4;cursor:default}
  .btn-reset{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn-reset:hover{color:var(--ink);border-color:var(--muted)}
  .pending-note{font-size:12px;color:var(--muted)} .pending-note b{color:var(--coral)}
  .spinner{width:13px;height:13px;border:2px solid #ffffff55;border-top-color:#241009;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* driver rows */
  .drow{border-top:1px solid var(--line);padding:16px 0}
  .drow:first-of-type{border-top:none}
  .drow-top{display:grid;grid-template-columns:1fr auto 26px;align-items:center;gap:16px}
  .dname{font-size:14.5px;font-weight:550}
  .dname .changed{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--coral);margin-left:8px;vertical-align:1px;opacity:0;transition:.15s}
  .drow.on .dname .changed{opacity:1}
  .dsub{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* 5-stop selector */
  .sel{display:flex;background:var(--track);border-radius:999px;padding:4px;gap:2px}
  .stop{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;min-width:46px;padding:7px 0;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
  .stop.active{background:var(--white);color:#1a1a1a}
  .stop.zero.active{background:#4a4a4a;color:var(--ink)}
  .chev{background:none;border:none;color:var(--blue);font-size:18px;cursor:pointer;line-height:1;padding:4px;transition:transform .18s}
  .chev.open{transform:rotate(90deg)}
  .members{margin-top:12px;display:none;font-size:12px;color:var(--muted)}
  .members.open{display:block}
  .members table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .members td{padding:3px 8px;border-bottom:1px solid var(--line)}
  .members td:first-child{color:var(--blue);font-weight:600;width:52px}
  .members .code{color:var(--ink)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#2a1512;color:var(--coral);border:1px solid #5a2a20;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">51Folds · Meta Mode</p>
  <h1 id="q">…</h1>
  <p class="meta" id="sub">…</p>

  <!-- OUTCOME DISTRIBUTION -->
  <section class="panel">
    <div class="phead">
      <h2>Outcome distribution</h2>
      <span class="status" id="ostatus">baseline</span>
    </div>
    <div class="bars" id="bars"></div>
    <div class="controls">
      <button class="btn-apply" id="apply" disabled>Apply changes</button>
      <button class="btn-reset" id="reset">Reset</button>
      <span class="pending-note" id="pending"></span>
    </div>
  </section>

  <!-- UNIFIED DRIVERS -->
  <section class="panel">
    <div class="phead">
      <h2>Unified drivers · relative shift</h2>
      <span class="status" id="dcount"></span>
    </div>
    <p class="meta" style="margin:2px 0 4px;font-size:12px">Each slider nudges every member driver up/down from its own baseline (−2…+2), then fans out to all models.</p>
    <div id="drivers"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const STOPS=[-2,-1,0,1,2];
let MODEL=null, deltas={}, busy=false;

const $=id=>document.getElementById(id);
const fmtpp=v=>(v>=0?'+':'')+ (v*100).toFixed(1)+'pp';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);};

async function boot(){
  MODEL = await (await fetch('/api/model')).json();
  $('q').textContent = MODEL.question;
  $('sub').innerHTML = `<b>${MODEL.tier}</b> · ${MODEL.n_models} models · <b>${MODEL.n_unified}</b> unified drivers · driver changes are free`;
  $('dcount').textContent = `${MODEL.n_unified} drivers`;
  MODEL.drivers.forEach(d=>deltas[d.uid]=0);
  renderBars(MODEL.baseline, null, 'baseline');
  renderDrivers();
}

function scaleMax(dist){ return Math.max(0.35, Math.max(...Object.values(dist))*1.12); }

function renderBars(dist, baseline, statusText, live){
  const max=scaleMax(dist);
  $('bars').innerHTML = MODEL.outcomes.map(lab=>{
    const v=dist[lab]||0, w=(v/max*100).toFixed(1);
    let chip='';
    if(baseline){
      const dp=v-(baseline[lab]||0), cls=Math.abs(dp)<0.001?'flat':dp>0?'up':'down';
      chip=`<span class="pp ${cls}">${fmtpp(dp)}</span>`;
    }
    const ghost = baseline ? `<div class="bar-ghost" style="left:${((baseline[lab]||0)/max*100).toFixed(1)}%"></div>`:'';
    return `<div class="bar-row">
      <span class="bar-lab">${lab}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div>${ghost}</div>
      <span class="bar-val">${(v*100).toFixed(1)}%${chip}</span>
    </div>`;
  }).join('');
  const s=$('ostatus'); s.textContent=statusText; s.classList.toggle('live', !!live);
}

function renderDrivers(){
  $('drivers').innerHTML = MODEL.drivers.map(d=>{
    const neutral = idxToState(d.neutral_idx);
    const sel = STOPS.map(v=>`<button class="stop ${v===0?'zero active':''}" data-uid="${d.uid}" data-v="${v}">${v>0?'+'+v:v}</button>`).join('');
    const rows = d.members.map(m=>`<tr><td>${m.model}</td><td class="code">${m.code}</td><td>${m.name}</td><td>${m.baseline}</td></tr>`).join('');
    return `<div class="drow" id="drow-${d.uid}">
      <div class="drow-top">
        <div>
          <div class="dname">${d.name}<span class="changed"></span></div>
          <div class="dsub">neutral ${neutral} · ${d.models_covered}/${MODEL.n_models} models · ${d.member_count} drivers</div>
        </div>
        <div class="sel">${sel}</div>
        <button class="chev" data-uid="${d.uid}">›</button>
      </div>
      <div class="members" id="mem-${d.uid}"><table>${rows}</table></div>
    </div>`;
  }).join('');

  document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{
    if(busy) return;
    const uid=+b.dataset.uid, v=+b.dataset.v;
    deltas[uid]=v;
    const row=b.closest('.drow');
    row.querySelectorAll('.stop').forEach(s=>{
      s.classList.toggle('active', +s.dataset.v===v);
      s.classList.toggle('zero', +s.dataset.v===0);
    });
    row.classList.toggle('on', v!==0);
    refreshPending();
  });
  document.querySelectorAll('.chev').forEach(c=>c.onclick=()=>{
    c.classList.toggle('open'); $('mem-'+c.dataset.uid).classList.toggle('open');
  });
}

function refreshPending(){
  const active=Object.entries(deltas).filter(([,v])=>v!==0);
  $('apply').disabled = active.length===0 || busy;
  $('pending').innerHTML = active.length ? `<b>${active.length}</b> driver${active.length>1?'s':''} shifted — not yet applied` : '';
}

$('apply').onclick=async()=>{
  const active=Object.fromEntries(Object.entries(deltas).filter(([,v])=>v!==0));
  if(!Object.keys(active).length) return;
  setBusy(true, `<span class="spinner"></span>recomputing ${MODEL.n_models} models…`);
  $('ostatus').textContent='recomputing…'; $('ostatus').classList.add('live');
  try{
    const r=await (await fetch('/api/move',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({deltas:active})})).json();
    if(r.error){toast(r.error); setBusy(false); return;}
    const t=r.timings;
    renderBars(r.adjusted, r.baseline,
      `adjusted · ${t.n_done}/${t.n_touched} models recomputed in ${t.total_s}s`, true);
  }catch(e){toast('request failed: '+e);}
  setBusy(false);
};

$('reset').onclick=async()=>{
  setBusy(true, `<span class="spinner"></span>resetting to baseline…`);
  try{
    const r=await (await fetch('/api/reset',{method:'POST'})).json();
    if(r.baseline) MODEL.baseline=r.baseline;
    MODEL.drivers.forEach(d=>deltas[d.uid]=0);
    renderDrivers(); renderBars(MODEL.baseline,null,'baseline');
  }catch(e){toast('reset failed: '+e);}
  setBusy(false);
};

function setBusy(b, note){
  busy=b;
  $('apply').disabled = b || !Object.values(deltas).some(v=>v!==0);
  $('reset').disabled = b;
  $('pending').innerHTML = b ? note : '';
  if(!b) refreshPending();
}

// mirror aeb.folds ordinal->state for the neutral caption
const STATES=["Negligible","Low","Medium","High","Extreme"];
function idxToState(i){ if(i===null||i===undefined) return "–"; return STATES[Math.max(0,Math.min(4,Math.round(i)))]; }

boot();
</script>
</body>
</html>
